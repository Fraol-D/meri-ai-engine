services:
  - type: web
    name: meri-ai-engine
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: GEMINI_TIMEOUT_SECONDS
        value: "30"
      - key: GEMINI_API_KEY
        sync: false
